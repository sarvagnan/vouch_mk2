name: ci

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  anchor:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Sync environment
        run: uv sync --locked
      - name: Build lock for anchoring and dogfood checks
        run: uv run vouch-mk2 build-lock --output "$RUNNER_TEMP/vouch.lock"
      - name: Advance evidence anchors and commit projections
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.fork == false
        shell: bash
        run: |
          python - <<'PY' > "$RUNNER_TEMP/vouch-evidence-heads"
          import json
          from pathlib import Path

          state = json.loads(Path(".vouch/state.json").read_text())
          for head in state["evidence_heads"]:
              if not head["anchor_run_id"]:
                  print(head["unit_name"])
          PY
          while IFS= read -r unit_name; do
            python "$RUNNER_TEMP/vouch.lock" advance-anchor --root .vouch --unit-name "$unit_name"
          done < "$RUNNER_TEMP/vouch-evidence-heads"
          python "$RUNNER_TEMP/vouch.lock" generate --root .vouch
          git add -- .vouch/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "vouch-anchor-bot"
          git config user.email "vouch-anchor-bot@users.noreply.github.com"
          git commit -m "vouch: advance evidence anchors"
      - name: Push anchored projections
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.fork == false
        shell: bash
        env:
          VOUCH_PUSH_TOKEN: ${{ github.token }}
        run: git push "https://x-access-token:${VOUCH_PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.event.repository.default_branch }}"
      - name: Dogfood — check mk2's OWN committed store from the lock (D-10)
        # Zero mechanical NOT_CHECKED, every organizational claim visibly
        # NOT_CHECKED, on this repository itself. The certificate is recomputed
        # and map freshness is audited: a stale dogfood store fails CI.
        shell: bash
        run: |
          python "$RUNNER_TEMP/vouch.lock" check --ci --root .vouch | tee "$RUNNER_TEMP/dogfood.txt"
          ! grep -E '^NOT-CHECKED +check\.' "$RUNNER_TEMP/dogfood.txt"
      - name: DoD walkthrough from the vendored lock with NO network
        # unshare -n gives the step an empty network namespace. The walkthrough
        # first PROVES the namespace denies a plain HTTP request
        # (--assert-no-network), then drives the whole lifecycle through the
        # lock as a subprocess with PYTHONPATH="".
        shell: bash
        run: sudo unshare -n -- env PATH="$PATH" python3 scripts/walkthrough.py --assert-no-network --lock "$RUNNER_TEMP/vouch.lock"

  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Sync environment
        run: uv sync --locked
      - name: Generated command reference is fresh
        run: uv run python scripts/gen_commands_doc.py --check
      - name: Types (Pyrefly strict)
        run: uv run pyrefly check
      - name: Purity contracts (import-linter)
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest
      - name: Initialize scratch check store
        run: uv run python -c "from vouch_mk2.store import Store; store = Store.init('$RUNNER_TEMP/vouch-mk2-ci-check'); store.close()"
      - name: CI check on scratch store
        run: uv run vouch-mk2 check --ci --root "$RUNNER_TEMP/vouch-mk2-ci-check"
      - name: JSON CI check on scratch store
        # shell: bash brings pipefail, so a FAIL exit from vouch-mk2 is not
        # masked by json.tool's success.
        shell: bash
        run: uv run vouch-mk2 check --ci --json --root "$RUNNER_TEMP/vouch-mk2-ci-check" | python3 -m json.tool > /dev/null
      - name: Generate scratch system map
        run: uv run vouch-mk2 generate --root "$RUNNER_TEMP/vouch-mk2-ci-check"
      - name: CI check generated scratch map
        run: uv run vouch-mk2 check --ci --root "$RUNNER_TEMP/vouch-mk2-ci-check"
      - name: Formal checking
        run: uv run vouch-mk2 formal
      - name: Build reproducible lock (twice — byte-identical)
        shell: bash
        run: |
          uv run vouch-mk2 build-lock --output "$RUNNER_TEMP/vouch.lock" | tee "$RUNNER_TEMP/lock-digest.txt"
          uv run vouch-mk2 build-lock --output "$RUNNER_TEMP/vouch2.lock" > /dev/null
          cmp "$RUNNER_TEMP/vouch.lock" "$RUNNER_TEMP/vouch2.lock"
      - name: Self-check lock against the build digest
        shell: bash
        run: python "$RUNNER_TEMP/vouch.lock" self-check --expect "$(awk '{print $2}' "$RUNNER_TEMP/lock-digest.txt")"
      - name: Check scratch store from lock
        run: python "$RUNNER_TEMP/vouch.lock" check --ci --root "$RUNNER_TEMP/vouch-mk2-ci-check"
      - name: Lifecycle evidence verb is vendored in the lock
        run: python "$RUNNER_TEMP/vouch.lock" record-evidence --help
