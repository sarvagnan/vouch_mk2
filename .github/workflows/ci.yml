name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync --locked
      - name: Types (Pyrefly strict)
        run: uv run pyrefly check
      - name: Purity contracts (import-linter)
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest
