[project]
name = "vouch-mk2"
version = "0.1.0"
description = "Vouch mk2 — typed policy engine with one authoritative snapshot, content-addressed artifacts, pure projections, and thin adapters"
readme = "README.md"
authors = [
    { name = "sarvagnan", email = "github@sl.sarva.email" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
vouch-mk2 = "vouch_mk2.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

# D-1 ground rules (DECISIONS.md): these gates run in CI from the first commit.

[tool.pyrefly]
project-includes = ["src", "tests"]

[tool.importlinter]
root_packages = ["vouch_mk2"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Policy IR and decision core are pure — no I/O-capable imports"
type = "forbidden"
source_modules = ["vouch_mk2.ir", "vouch_mk2.core", "vouch_mk2.checks", "vouch_mk2.formal", "vouch_mk2.projections"]
forbidden_modules = [
    "hashlib",
    "os",
    "io",
    "sys",
    "json",
    "pathlib",
    "shutil",
    "tempfile",
    "subprocess",
    "socket",
    "urllib",
    "http",
]

[[tool.importlinter.contracts]]
name = "Store is the only I/O owner"
type = "forbidden"
source_modules = ["vouch_mk2.ir", "vouch_mk2.core", "vouch_mk2.checks", "vouch_mk2.formal", "vouch_mk2.projections"]
forbidden_modules = ["vouch_mk2.store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: longer-running end-to-end acceptance probes"]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    # Dev-only: validates the CI workflow `init` generates. The runtime artifact
    # (`vouch.lock`) vendors src/ only and stays dependency-free (D-2).
    "pyyaml>=6.0",
]
